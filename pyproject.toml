[project]
name = "warrant"
version = "0.1.0"
description = "Warrant — proves the merchant to the agent, and makes that proof a precondition of the payment credential."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "sqlmodel",
    "pydantic",
    "httpx",
    "python-dotenv",
    "tldextract",
    "cryptography",
    "langgraph",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
# Makes `import app.warrant` work without installing the project.
pythonpath = ["backend", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
